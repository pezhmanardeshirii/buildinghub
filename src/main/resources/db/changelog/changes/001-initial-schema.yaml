databaseChangeLog:
  - changeSet:
      id: 001-create-buildings
      author: buildinghub
      changes:
        - createTable:
            tableName: buildings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_buildings
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: address
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
  - changeSet:
      id: 002-create-units
      author: buildinghub
      changes:
        - createTable:
            tableName: units
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_units
              - column:
                  name: building_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_units_building
                    references: buildings(id)
              - column:
                  name: unit_number
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: floor_number
                  type: INT
              - column:
                  name: area_sqm
                  type: NUMERIC(10,2)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: units
            columnNames: building_id, unit_number
            constraintName: uq_units_building_unit_number
