services:
  postgres:
    image: postgres:17
    container_name: buildinghub-postgres
    environment:
      POSTGRES_DB: buildinghub
      POSTGRES_USER: buildinghub
      POSTGRES_PASSWORD: buildinghub
    ports:
      - "5432:5432"
    volumes:
      - buildinghub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildinghub -d buildinghub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buildinghub-postgres-data:
